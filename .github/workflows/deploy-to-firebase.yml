name: Publish Stitch Scroll

# Runs every time Will pushes to main (GitHub Desktop or Claude on his approval).
# Lands on Firebase Hosting = stitchscroll.digirunestudios.com. Same pattern as Sheetmancer.
on:
  push:
    branches: [main]
  workflow_dispatch:

# KEYLESS AUTH (Workload Identity Federation). No stored credential anywhere in this repo.
# GitHub mints a short-lived identity token, Google verifies it came from this repository,
# and hands back a pass that expires in minutes.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Deploy Stitch Scroll (app site, and the website once switched)
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v5

      - name: Prove who we are to Google (no key involved)
        uses: google-github-actions/auth@v3
        with:
          project_id: stitchscroll-app
          workload_identity_provider: projects/1090575321809/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-actions-publisher@stitchscroll-app.iam.gserviceaccount.com

      - name: Install the Firebase CLI
        run: npm install -g firebase-tools

      - name: Make sure the hidden app site exists (one time; harmless after)
        run: firebase hosting:sites:create digirune-ss-app --project stitchscroll-app --non-interactive || echo "app site already exists"

      - name: Publish
        # PHASE A (2026-10-02): only the hidden app site is published. The branded address keeps serving
        # the v0.3.3 app until the new store builds pass on real phones (Will's OK), then PHASE B changes
        # this line to:  firebase deploy --only hosting --project stitchscroll-app --non-interactive
        run: firebase deploy --only hosting:app --project stitchscroll-app --non-interactive
